# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"
  jobs:
    pre_build:
    - python -m sphinx.ext.apidoc --private --separate --force --output-dir docs/source/auto aivm
    - python dev/devcheck/architecture_docs.py check

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false


python:
  install:
  - method: pip
    path: .
    extra_requirements:
    - docs
